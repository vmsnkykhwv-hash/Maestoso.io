# Testdatenbank für die Browser-Tests: Postgres + PostgREST, wie Supabase
# sie intern nutzt. Kein echtes Supabase-Projekt nötig, keine echten Daten.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maestoso
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:auth@db:5432/maestoso
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: e2e-nur-fuer-tests-e2e-nur-fuer-tests-123
      PGRST_SERVER_PORT: 3001
    ports:
      - "3001:3001"
